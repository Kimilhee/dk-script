<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10243f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Constraint Decoding PoC</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">RESEARCH-ONLY THROWAWAY PROTOTYPE</p>
          <h1>온디바이스 수식 필기 인식</h1>
          <p>학교급을 고르고 예제를 따라 쓴 뒤 변환하세요.</p>
        </div>
        <output id="status">초기화 중…</output>
      </header>

      <section id="exercise-prompt" class="exercise" aria-label="따라 쓸 수식">
        <strong>따라 쓰기</strong>
        <div id="exercise-latex" class="exercise-latex"></div>
        <span id="exercise-count" class="exercise-count"></span>
      </section>
      <section class="results" aria-label="인식 결과">
        <article id="result-problem">
          <h2>인식 결과</h2>
          <div class="latex">—</div>
          <p class="meta"></p>
          <div class="alternatives" aria-label="후보 결과"></div>
        </article>
      </section>
      <p id="no-exercises" class="notice" hidden>이 학교급에서 사용할 연습 수식이 없습니다.</p>
      <nav id="level-picker" class="level-picker" aria-label="학교급 선택">
        <button type="button" data-level="elementary" aria-pressed="false">초등</button>
        <button type="button" data-level="middle" aria-pressed="true">중등</button>
        <button type="button" data-level="high" aria-pressed="false">고등</button>
      </nav>

      <section class="drawing">
        <div class="actions">
          <button id="clear" type="button">지우기</button>
          <button id="convert" type="button" disabled>변환</button>
        </div>
        <canvas id="ink" aria-label="수식 필기 캔버스"></canvas>
      </section>
      <section id="practice-feedback" class="practice-feedback" aria-live="polite" hidden>
        <p id="feedback-message"></p>
        <div class="feedback-actions">
          <button id="mark-correct" type="button">표현이 달라도 맞아요</button>
          <button id="retry" type="button">다시 써보기</button>
          <button id="next-exercise" type="button" hidden>다음 수식</button>
          <button id="finish-practice" type="button" hidden>여기서 마치기</button>
        </div>
      </section>
      <section id="practice-finished" class="practice-finished" hidden>
        <p>연습을 마쳤습니다.</p>
        <button id="restart-practice" type="button">다시 시작</button>
      </section>
      <footer>
        비상업적 연구용 PoC ·
        <a href="https://huggingface.co/m4jkiuwr/htt-mini">Hand-to-TeX 모델</a> ·
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">MathWriting CC BY-NC-SA 4.0</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
